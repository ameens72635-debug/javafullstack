<!DOCTYPE html>
<html>
<head>
  <title>Hello HTML</title>
  <style>
    #guess-container {
      margin-top: 1.5rem;
      max-width: 360px;
      font-family: Arial, sans-serif;
    }

    #guess-container label,
    #guess-container input,
    #guess-container button {
      display: block;
      width: 100%;
    }

    #guess-container input {
      margin: 0.4rem 0 0.8rem;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    #guess-container button {
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background: #2a7cff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #guess-container button:hover {
      background: #1c64d1;
    }

    #guess-output {
      margin-top: 1rem;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .notification {
      margin: 0.4rem 0;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid transparent;
    }

    .notification.info {
      background: #eef6ff;
      color: #1c3d7a;
      border-color: #a8d0ff;
    }

    .notification.success {
      background: #e6f7ea;
      color: #1f5f35;
      border-color: #7dd48f;
    }

    .notification.warning {
      background: #fff4e5;
      color: #7a4d1c;
      border-color: #ffcd7d;
    }

    .notification.error {
      background: #ffecec;
      color: #7a1c1c;
      border-color: #ff9c9c;
    }
  </style>
  <script src="script.js"></script>
  <script src="atm.js"></script>
</head>
<body>
  <h1>Hello, Syed!</h1>
  <p>This is my first HTML page.</p>

  <div id="guess-container">
    <label for="guess-input">Enter a number (1-100):</label>
    <input id="guess-input" type="number" min="1" max="100" placeholder="e.g. 42" />
    <button type="button" onclick="runGuessFromInput()">Submit Guess</button>
    <button type="button" onclick="initGame()" style="margin-top: 0.5rem;">New Game</button>
    <div id="guess-output" style="margin-top: 1rem; font-family: monospace; white-space: pre-wrap;"></div>
  </div>
</body>
</html>
